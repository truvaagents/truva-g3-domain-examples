apiVersion: v1
kind: Service
metadata:
  name: maintenance-repair-agent
  namespace: software-maintenance
  labels:
    app: maintenance-repair-agent
    component: agent
    app.kubernetes.io/part-of: software-maintenance
spec:
  selector:
    app: maintenance-repair-agent
    component: agent
  ports:
    - name: http
      port: 80
      targetPort: 8400
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-repair-agent
  namespace: software-maintenance
  labels:
    app: maintenance-repair-agent
    component: agent
    app.kubernetes.io/part-of: software-maintenance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maintenance-repair-agent
      component: agent
  template:
    metadata:
      labels:
        app: maintenance-repair-agent
        component: agent
        app.kubernetes.io/part-of: software-maintenance
    spec:
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 20001
        fsGroup: 20001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: maintenance-repair-agent
          image: maintenance-repair-agent:latest
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8400
          envFrom:
            - configMapRef:
                name: maintenance-repair-agent-env-config
            - secretRef:
                name: maintenance-repair-agent-secrets
          env:
            - name: PORT
              value: "8400"
            - name: NAMESPACE
              value: software-maintenance
            - name: REDIS_URL
              value: redis://redis.truvag3-examples:6379/0
            - name: TRUVAG3_REDIS_NAMESPACE
              value: default
            - name: TRUVAG3_AGENT_NAME
              value: maintenance-repair-agent
            # Hide this agent's own entry point from its planner; other agents can delegate to it.
            - name: TRUVAG3_EXCLUDED_CAPABILITIES
              value: propose_maintenance_change
            - name: TRUVAG3_DISCOVERY_RETRY
              value: "true"
            - name: TRUVAG3_DISCOVERY_RETRY_INTERVAL
              value: 30s
            - name: TRUVAG3_K8S_SERVICE_NAME
              value: maintenance-repair-agent
            - name: TRUVAG3_K8S_SERVICE_PORT
              value: "80"
            - name: TRUVAG3_K8S_POD_APP_LABEL
              value: maintenance-repair-agent
            - name: TRUVAG3_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TRUVAG3_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MAINTENANCE_REPAIR_PROFILES_FILE
              value: /app/profiles/retail-order-repair.json
            - name: APP_ENV
              value: development
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.truvag3-examples:4318
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /repair/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maintenance-repair-agent
  namespace: software-maintenance
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "660"
  labels:
    app: maintenance-repair-agent
    component: agent
    app.kubernetes.io/part-of: software-maintenance
spec:
  ingressClassName: nginx
  rules:
    - host: maintenance-repair-agent.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: maintenance-repair-agent
                port:
                  number: 80
