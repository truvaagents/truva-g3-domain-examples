apiVersion: v1
kind: Service
metadata:
  name: maintenance-evidence-tool
  namespace: software-maintenance
  labels:
    app: maintenance-evidence-tool
    component: tool
    app.kubernetes.io/part-of: software-maintenance
spec:
  selector:
    app: maintenance-evidence-tool
  ports:
    - name: http
      port: 80
      targetPort: 8397
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-evidence-tool
  namespace: software-maintenance
  labels:
    app: maintenance-evidence-tool
    component: tool
    app.kubernetes.io/part-of: software-maintenance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maintenance-evidence-tool
  template:
    metadata:
      labels:
        app: maintenance-evidence-tool
        component: tool
        app.kubernetes.io/part-of: software-maintenance
    spec:
      automountServiceAccountToken: false
      # Allow the existing 30s HTTP drain plus the 5s telemetry flush to finish.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: maintenance-evidence-tool
          image: maintenance-evidence-tool:latest
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8397
          envFrom:
            - configMapRef:
                name: maintenance-evidence-tool-env-config
          env:
            - name: PORT
              value: "8397"
            - name: NAMESPACE
              value: software-maintenance
            - name: REDIS_URL
              value: redis://redis.truvag3-examples:6379/0
            - name: TRUVAG3_REDIS_NAMESPACE
              value: default
            - name: TRUVAG3_DISCOVERY_RETRY
              value: "true"
            - name: TRUVAG3_DISCOVERY_RETRY_INTERVAL
              value: 30s
            - name: TRUVAG3_K8S_SERVICE_NAME
              value: maintenance-evidence-tool
            - name: TRUVAG3_K8S_SERVICE_PORT
              value: "80"
            - name: TRUVAG3_K8S_POD_APP_LABEL
              value: maintenance-evidence-tool
            - name: TRUVAG3_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TRUVAG3_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MAINTENANCE_EVIDENCE_PROFILES_FILE
              value: /app/profiles/retail-order-service.json
            - name: MAINTENANCE_EVIDENCE_COORDINATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maintenance-evidence-tool-secrets
                  key: MAINTENANCE_EVIDENCE_COORDINATOR_TOKEN
            - name: MAINTENANCE_EVIDENCE_REPAIR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maintenance-evidence-tool-secrets
                  key: MAINTENANCE_EVIDENCE_REPAIR_TOKEN
            - name: MAINTENANCE_EVIDENCE_REVIEW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maintenance-evidence-tool-secrets
                  key: MAINTENANCE_EVIDENCE_REVIEW_TOKEN
            - name: APP_ENV
              value: development
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.truvag3-examples:4318
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 150m
              memory: 96Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/capabilities
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maintenance-evidence-tool
  namespace: software-maintenance
  labels:
    app: maintenance-evidence-tool
    component: tool
    app.kubernetes.io/part-of: software-maintenance
spec:
  ingressClassName: nginx
  rules:
    - host: maintenance-evidence-tool.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: maintenance-evidence-tool
                port:
                  number: 80
