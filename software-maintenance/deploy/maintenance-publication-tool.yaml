apiVersion: v1
kind: Service
metadata:
  name: maintenance-publication-tool
  namespace: software-maintenance
  labels:
    app: maintenance-publication-tool
    component: tool
    app.kubernetes.io/part-of: software-maintenance
spec:
  selector:
    app: maintenance-publication-tool
    component: tool
  ports:
    - name: http
      port: 80
      targetPort: 8403
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-publication-tool
  namespace: software-maintenance
  labels:
    app: maintenance-publication-tool
    component: tool
    app.kubernetes.io/part-of: software-maintenance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maintenance-publication-tool
      component: tool
  template:
    metadata:
      labels:
        app: maintenance-publication-tool
        component: tool
        app.kubernetes.io/part-of: software-maintenance
    spec:
      terminationGracePeriodSeconds: 40
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 20001
        fsGroup: 20001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: maintenance-publication-tool
          image: maintenance-publication-tool:latest
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8403
          envFrom:
            - configMapRef:
                name: maintenance-publication-tool-env-config
          env:
            - name: PORT
              value: "8403"
            - name: NAMESPACE
              value: software-maintenance
            - name: REDIS_URL
              value: redis://redis.truvag3-examples:6379/0
            - name: TRUVAG3_REDIS_NAMESPACE
              value: default
            - name: TRUVAG3_DISCOVERY_RETRY
              value: "true"
            - name: TRUVAG3_DISCOVERY_RETRY_INTERVAL
              value: 30s
            - name: TRUVAG3_K8S_SERVICE_NAME
              value: maintenance-publication-tool
            - name: TRUVAG3_K8S_SERVICE_PORT
              value: "80"
            - name: TRUVAG3_K8S_POD_APP_LABEL
              value: maintenance-publication-tool
            - name: TRUVAG3_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TRUVAG3_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MAINTENANCE_PUBLICATION_PROFILES_FILE
              value: /app/profiles/retail-order-publication.json
            - name: MAINTENANCE_WORKSPACE_TOOL_URL
              value: http://maintenance-workspace-tool.software-maintenance.svc.cluster.local
            - name: MAINTENANCE_REVIEW_AGENT_URL
              value: http://maintenance-review-agent.software-maintenance.svc.cluster.local
            - name: MAINTENANCE_PUBLICATION_COORDINATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maintenance-publication-tool-secrets
                  key: MAINTENANCE_PUBLICATION_COORDINATOR_TOKEN
            - name: MAINTENANCE_WORKSPACE_PUBLICATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maintenance-publication-tool-secrets
                  key: MAINTENANCE_WORKSPACE_PUBLICATION_TOKEN
                  optional: true
            - name: MAINTENANCE_REVIEW_PUBLICATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maintenance-publication-tool-secrets
                  key: MAINTENANCE_REVIEW_PUBLICATION_TOKEN
                  optional: true
            - name: GITHUB_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maintenance-publication-tool-secrets
                  key: GITHUB_WRITE_TOKEN
                  optional: true
            - name: APP_ENV
              value: development
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.truvag3-examples:4318
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 192Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/capabilities
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maintenance-publication-tool
  namespace: software-maintenance
  labels:
    app: maintenance-publication-tool
    component: tool
    app.kubernetes.io/part-of: software-maintenance
spec:
  ingressClassName: nginx
  rules:
    - host: maintenance-publication-tool.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: maintenance-publication-tool
                port:
                  number: 80
