apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentic-commerce-ingress
  namespace: truvag3-examples
  labels:
    app: order-operations-agent
    app.kubernetes.io/part-of: agentic-commerce
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
  - host: agentic-commerce.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: order-operations-agent-service
            port:
              number: 80
