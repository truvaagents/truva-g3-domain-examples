---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-core
  namespace: truvag3-examples
  labels:
    app: commerce-core
    component: tool
    framework: truvag3
    app.kubernetes.io/part-of: agentic-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commerce-core
  template:
    metadata:
      labels:
        app: commerce-core
        component: tool
        framework: truvag3
        truvag3.framework/type: tool
        app.kubernetes.io/part-of: agentic-commerce
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: commerce-core
        image: commerce-core:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8395
        envFrom:
        - configMapRef:
            name: commerce-core-config
        - configMapRef:
            name: commerce-core-env-config
            optional: true
        - secretRef:
            name: agentic-commerce-control-secrets
        env:
        - name: REDIS_URL
          value: "redis://redis.truvag3-examples:6379"
        - name: TRUVAG3_DISCOVERY_RETRY
          value: "true"
        - name: TRUVAG3_DISCOVERY_RETRY_INTERVAL
          value: "30s"
        - name: TRUVAG3_K8S_SERVICE_NAME
          value: "commerce-core-service"
        - name: TRUVAG3_K8S_SERVICE_PORT
          value: "80"
        - name: TRUVAG3_K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TRUVAG3_K8S_POD_APP_LABEL
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['app']
        - name: TRUVAG3_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            cpu: "10m"
            memory: "24Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 12
        readinessProbe:
          httpGet:
            path: /api/capabilities
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
